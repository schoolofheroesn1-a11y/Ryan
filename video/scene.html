<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Школа Жизни — ролик</title>
<link rel="stylesheet" href="fonts/nunito.css">
<style>
  html,body{margin:0;padding:0;background:#000;}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Nunito',sans-serif;}
  #art{position:absolute;inset:0;}
  #caps{position:absolute;left:0;right:0;top:190px;display:flex;flex-direction:column;align-items:center;gap:22px;pointer-events:none;}
  .main{background:#fff;color:#2B1D2E;font-weight:900;font-size:74px;line-height:1.08;padding:26px 46px 30px;border-radius:42px;
        box-shadow:0 12px 0 rgba(60,30,20,.16);max-width:900px;text-align:center;transform-origin:50% 50%;}
  .sub{color:#fff;font-weight:800;font-size:50px;line-height:1.1;padding:14px 36px 18px;border-radius:999px;max-width:900px;text-align:center;
       box-shadow:0 8px 0 rgba(60,30,20,.16);transform-origin:50% 50%;}
  svg text{font-family:'Nunito',sans-serif;}
</style>
</head>
<body>
<div id="stage">
  <svg id="art" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="caps"></div>
</div>
<script>
const TOTAL = 67.6;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const pop=(lt,t0,d=.45)=>lt<t0?0:back((lt-t0)/d);
const fade=(lt,t0,d=.3)=>clamp((lt-t0)/d);
const rnd=(i)=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const S=Math.sin, C=Math.cos, PI=Math.PI;

// ---------- palette ----------
const P={ink:'#2B1D2E',orange:'#FF7A1A',coral:'#FF6B6B',teal:'#2EC4B6',yellow:'#FFC93C',purple:'#9B7EDE',
  blue:'#3F6FD8',green:'#57B86B',pink:'#FF8FB1',navy:'#2F3E66',cream:'#FFF4E0'};
const SK=['#F7CBA8','#E8B08A','#C98E66','#F2D2B6','#DDA27C'];

// ---------- characters ----------
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return '#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('');}
function kid(o){
  const d=Object.assign({x:0,y:0,s:1,skin:SK[0],hair:'#4A3428',hs:'short',shirt:P.teal,pants:'#3D405B',bag:false,
    aL:12,aR:12,lL:0,lR:0,mouth:'smile',num:null,glasses:false,rot:0,blush:true,outfit:'tee',top:'#1E1E22',hood:'down',freckles:false},o);
  const L=105; let g=''; const dk=shade(d.shirt,-.22), hd=shade(d.hair,-.25);
  const arm=(side,a)=>{const sx=side*52,sy=-218,r=a*PI/180;const ex=sx+side*S(r)*L,ey=sy+C(r)*L;
    return `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${d.shirt}" stroke-width="30" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="16" fill="${d.skin}"/>`};
  const leg=(side,a)=>{const sx=side*26,sy=-112,r=a*PI/180;const ex=sx+S(r)*98,ey=sy+C(r)*98;
    return `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${d.pants}" stroke-width="34" stroke-linecap="round"/><ellipse cx="${ex+side*7}" cy="${ey+8}" rx="25" ry="13" fill="#2B2D42"/>`};
  // ---- back layers
  if(d.bag) g+=`<rect x="-80" y="-240" width="160" height="132" rx="36" fill="${P.orange}"/><rect x="-30" y="-262" width="60" height="30" rx="15" fill="none" stroke="${P.orange}" stroke-width="10"/>`;
  if(d.hs==='long') g+=`<rect x="-68" y="-336" width="136" height="128" rx="52" fill="${d.hair}"/>`;
  if(d.hs==='longstraight') g+=`<rect x="-72" y="-338" width="144" height="160" rx="54" fill="${d.hair}"/>`;
  if(d.hs==='bob') g+=`<rect x="-70" y="-342" width="140" height="92" rx="42" fill="${d.hair}"/>`;
  if(d.hs==='braid'){for(const [cx,cy,r] of [[-64,-282,24],[-70,-252,20],[64,-282,24]]) g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${d.hair}"/>`;}
  if(d.hs==='tails') g+=`<circle cx="-70" cy="-296" r="24" fill="${d.hair}"/><circle cx="70" cy="-296" r="24" fill="${d.hair}"/>`;
  if(d.hs==='hood') g+=`<circle cx="0" cy="-304" r="80" fill="${d.shirt}"/>`;
  g+=leg(-1,d.lL)+leg(1,d.lR);
  g+=`<rect x="-62" y="-246" width="124" height="148" rx="44" fill="${d.shirt}"/>`;
  // ---- outfit details
  if(d.outfit==='uniform') g+=`<path d="M-24,-244 L0,-214 L24,-244Z" fill="#fff"/>`;
  if(d.outfit==='tee') g+=`<path d="M-24,-246 Q0,-222 24,-246" fill="none" stroke="${dk}" stroke-width="7"/><rect x="-30" y="-196" width="60" height="40" rx="10" fill="${shade(d.shirt,.12)}"/>`;
  if(d.outfit==='hoodie'){g+=`<rect x="-42" y="-168" width="84" height="44" rx="14" fill="${dk}"/><line x1="0" y1="-240" x2="0" y2="-104" stroke="${dk}" stroke-width="4"/>`;
    if(d.hood==='down') g+=`<path d="M-50,-248 Q0,-226 50,-248 Q40,-262 0,-262 Q-40,-262 -50,-248Z" fill="${dk}"/>`;
    g+=`<line x1="-12" y1="-238" x2="-15" y2="-196" stroke="#EEE" stroke-width="4" stroke-linecap="round"/><line x1="12" y1="-238" x2="15" y2="-196" stroke="#EEE" stroke-width="4" stroke-linecap="round"/>`;}
  if(d.outfit==='zipopen') g+=`<path d="M-20,-246 L20,-246 L16,-100 L-16,-100Z" fill="${d.top}"/><line x1="-20" y1="-246" x2="-16" y2="-100" stroke="${dk}" stroke-width="5"/><line x1="20" y1="-246" x2="16" y2="-100" stroke="${dk}" stroke-width="5"/><rect x="-6" y="-200" width="12" height="3" fill="#ccc"/>`;
  if(d.outfit==='jacket') g+=`<path d="M-40,-250 L-6,-246 L-2,-208Z" fill="${shade(d.shirt,.18)}"/><path d="M40,-250 L6,-246 L2,-208Z" fill="${shade(d.shirt,.18)}"/><line x1="0" y1="-210" x2="0" y2="-104" stroke="${shade(d.shirt,.25)}" stroke-width="4"/>`;
  if(d.bag) g+=`<rect x="-48" y="-242" width="15" height="112" rx="7" fill="${P.orange}"/><rect x="33" y="-242" width="15" height="112" rx="7" fill="${P.orange}"/>`;
  if(d.num!==null) g+=`<circle cx="0" cy="-160" r="30" fill="#fff"/><text x="0" y="-147" font-size="${String(d.num).length>1?30:36}" font-weight="900" text-anchor="middle" fill="${P.ink}">${d.num}</text>`;
  g+=arm(-1,d.aL)+arm(1,d.aR);
  g+=`<rect x="-14" y="-258" width="28" height="22" fill="${d.skin}"/>`;
  g+=`<circle cx="0" cy="-300" r="58" fill="${d.skin}"/>`;
  // ---- hair on top
  const cap=`<path d="M-63,-296 C-68,-376 68,-378 63,-296 C44,-326 -6,-334 -63,-296Z" fill="${d.hair}"/>`;
  if(d.hs==='curly'){for(let i=0;i<7;i++){const a=PI*(1.05+i*0.15);g+=`<circle cx="${C(a)*52}" cy="${-306+S(a)*52}" r="22" fill="${d.hair}"/>`;}}
  else if(d.hs==='longstraight') g+=`<path d="M-64,-290 C-70,-380 70,-380 64,-290 C52,-330 14,-346 2,-352 C-10,-346 -52,-330 -64,-290Z" fill="${d.hair}"/><path d="M-62,-300 L-74,-196 L-50,-196 L-50,-290Z" fill="${d.hair}"/><path d="M62,-300 L74,-196 L50,-196 L50,-290Z" fill="${d.hair}"/>`;
  else if(d.hs==='braid'){for(let i=0;i<8;i++){const a=PI*(1.0+i*0.143);g+=`<circle cx="${C(a)*56}" cy="${-304+S(a)*56}" r="${i%2?22:25}" fill="${d.hair}"/>`;}
    for(let i=0;i<6;i++) g+=`<ellipse cx="${44+i*3}" cy="${-252+i*24}" rx="17" ry="15" fill="${i%2?hd:d.hair}"/>`;
    g+=`<path d="M-58,-300 q-10,30 4,52" fill="none" stroke="${d.hair}" stroke-width="6" stroke-linecap="round"/>`;}
  else if(d.hs==='hood') g+=`<path d="M-48,-318 C-30,-352 30,-352 48,-318 C20,-330 -20,-330 -48,-318Z" fill="${d.hair}"/><path d="M-62,-282 C-74,-382 74,-382 62,-282" fill="none" stroke="${dk}" stroke-width="16" stroke-linecap="round"/>`;
  else if(d.hs==='bob') g+=`<path d="M-66,-280 C-74,-384 74,-386 68,-276 L62,-258 C56,-300 30,-330 -24,-322 C-44,-316 -56,-300 -60,-262Z" fill="${d.hair}"/>`;
  else if(d.hs==='shaggy') g+=`<path d="M-66,-296 C-74,-384 74,-386 66,-296 L60,-312 L52,-300 L42,-320 L30,-306 L18,-324 L6,-308 L-6,-326 L-18,-310 L-30,-326 L-42,-308 L-54,-320 L-60,-302Z" fill="${d.hair}"/><circle cx="-40" cy="-352" r="22" fill="${d.hair}"/><circle cx="36" cy="-354" r="24" fill="${d.hair}"/><circle cx="0" cy="-366" r="22" fill="${d.hair}"/>`;
  else g+=cap;
  if(d.hs==='bun') g+=`<circle cx="0" cy="-370" r="26" fill="${d.hair}"/>`;
  // ---- face
  g+=`<circle cx="-20" cy="-298" r="6.5" fill="${P.ink}"/><circle cx="20" cy="-298" r="6.5" fill="${P.ink}"/>`;
  if(d.blush) g+=`<circle cx="-36" cy="-279" r="10" fill="#FF8A8A" opacity=".45"/><circle cx="36" cy="-279" r="10" fill="#FF8A8A" opacity=".45"/>`;
  if(d.freckles) g+=[[-30,-286],[-24,-280],[-36,-282],[30,-286],[24,-280],[36,-282]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2" fill="#B07850" opacity=".7"/>`).join('');
  if(d.glasses) g+=`<g fill="none" stroke="${P.ink}" stroke-width="4"><circle cx="-21" cy="-298" r="16"/><circle cx="21" cy="-298" r="16"/><line x1="-5" y1="-300" x2="5" y2="-300"/></g>`;
  if(d.mouth==='laugh') g+=`<path d="M-19,-276 Q0,-246 19,-276Z" fill="#B23A48"/>`;
  else if(d.mouth==='o') g+=`<ellipse cx="0" cy="-268" rx="9" ry="12" fill="#B23A48"/>`;
  else g+=`<path d="M-16,-276 Q0,-260 16,-276" fill="none" stroke="${P.ink}" stroke-width="5" stroke-linecap="round"/>`;
  return `<g transform="translate(${d.x},${d.y}) scale(${d.s}) rotate(${d.rot})">${g}</g>`;
}
// Characters based on the real students' photos
const KIDS={
  A:{hs:'longstraight',hair:'#5B3A26',glasses:true,shirt:'#7B7A5A',outfit:'hoodie',hood:'down',pants:'#3D405B',skin:'#F6D2BA'},
  B:{hs:'braid',hair:'#A9804F',shirt:'#7A2433',outfit:'zipopen',top:'#1E1E22',pants:'#2B2D42',skin:'#F3CDB3',freckles:true},
  C:{hs:'hood',hair:'#3B2A22',shirt:'#A9ABAE',outfit:'hoodie',hood:'up',pants:'#3D405B',skin:'#F2C9AE'},
  D:{hs:'bob',hair:'#C0612B',shirt:'#26262C',outfit:'jacket',pants:'#3D405B',skin:'#F8D7C4'},
  E:{hs:'shaggy',hair:'#8A6440',shirt:'#3E3638',outfit:'tee',pants:'#3B4A6B',skin:'#F3C9AA',bag:true},
};
const K=(id,o)=>kid(Object.assign({},KIDS[id],o));
const HERO=KIDS.E;
const hero=o=>kid(Object.assign({},HERO,o));
function walk(t,sp=9,amp=22){const ph=t*sp;return {lL:S(ph)*amp,lR:-S(ph)*amp,aL:14+S(ph)*16,aR:14-S(ph)*16,bob:Math.abs(S(ph))*9};}

// ---------- props ----------
function bubble(x,y,text,k,col='#fff',fs=40,tc=P.ink){
  if(k<=0) return '';
  const w=text.length*fs*0.56+64,h=fs+44;
  return `<g transform="translate(${x},${y}) scale(${k})"><g transform="translate(0,${-h-26})">
   <rect x="${-w/2}" y="0" width="${w}" height="${h}" rx="${h/2}" fill="${col}"/>
   <path d="M-18,${h-2} L0,${h+26} L18,${h-2}Z" fill="${col}"/>
   <text x="0" y="${h/2+fs*0.36}" font-size="${fs}" font-weight="800" text-anchor="middle" fill="${tc}">${text}</text></g></g>`;
}
const heart=(x,y,s,col=P.coral,op=1)=>`<path transform="translate(${x},${y}) scale(${s})" opacity="${op}" fill="${col}" d="M0,-8 C-14,-34 -52,-22 -46,6 C-42,26 -16,40 0,56 C16,40 42,26 46,6 C52,-22 14,-34 0,-8Z"/>`;
function star(x,y,r,col=P.yellow,rot=0){let p='';for(let i=0;i<10;i++){const a=rot+i*PI/5-PI/2,rr=i%2?r*.45:r;p+=`${x+C(a)*rr},${y+S(a)*rr} `;}return `<polygon points="${p}" fill="${col}"/>`;}
function cloud(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})" fill="#fff"><ellipse cx="0" cy="0" rx="90" ry="50"/><ellipse cx="-70" cy="18" rx="60" ry="38"/><ellipse cx="75" cy="16" rx="65" ry="40"/><ellipse cx="10" cy="-35" rx="55" ry="45"/></g>`;}
function plant(x,y,s=1){return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="-30" cy="-150" rx="26" ry="70" fill="#4FA35F" transform="rotate(-25 -30 -150)"/><ellipse cx="30" cy="-150" rx="26" ry="70" fill="#5DBB6E" transform="rotate(25 30 -150)"/><ellipse cx="0" cy="-175" rx="28" ry="80" fill="#6CCB7B"/><path d="M-55,-90 L55,-90 L40,0 L-40,0Z" fill="#E07A4F"/></g>`;}
function windowArch(x,y,w,h,glass='#BFE6FF',frame='#fff'){return `<g><path d="M${x},${y+h} L${x},${y+w/2} A${w/2},${w/2} 0 0 1 ${x+w},${y+w/2} L${x+w},${y+h}Z" fill="${glass}" stroke="${frame}" stroke-width="14"/><line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y+h}" stroke="${frame}" stroke-width="10"/><line x1="${x}" y1="${y+h*.6}" x2="${x+w}" y2="${y+h*.6}" stroke="${frame}" stroke-width="10"/></g>`;}
function playCard(x,y,rot,s=1,suit=0){const col=suit%2?P.ink:'#E0384A';const sym=suit%2?`<path d="M0,-14 L12,0 L0,14 L-12,0Z" fill="${col}"/>`:heart(0,-4,.32,col);
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})"><rect x="-26" y="-36" width="52" height="72" rx="8" fill="#fff" stroke="#E6D6C8" stroke-width="3"/>${sym}</g>`;}
function bg(c1,c2){return `<defs><linearGradient id="g${c1.slice(1)}${c2.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#g${c1.slice(1)}${c2.slice(1)})"/>`;}

// ---------- scenes ----------
const SCENES=[
 {t0:0,   t1:5.5,  f:street},
 {t0:5.5, t1:11,   f:atrium},
 {t0:11,  t1:19.3, f:lesson},
 {t0:19.3,t1:29.8, f:breakTime},
 {t0:29.8,t1:34.1, f:canteen},
 {t0:34.1,t1:40.8, f:volley},
 {t0:40.8,t1:47.1, f:bday},
 {t0:47.1,t1:50.8, f:santa},
 {t0:50.8,t1:57.6, f:homework},
 {t0:57.6,t1:67.6, f:finale},
];

function street(lt){
  let g=bg('#8FD3FF','#FFE7C2');
  const sunY=lerp(1000,700,eo(lt/3));
  let rays='';for(let i=0;i<12;i++){const a=i*PI/6+lt*.25;rays+=`<rect x="-10" y="-175" width="20" height="55" rx="10" fill="${P.yellow}" transform="rotate(${a*180/PI})"/>`;}
  g+=`<g transform="translate(850,${sunY})">${rays}<circle r="95" fill="${P.yellow}"/></g>`;
  g+=cloud(200+lt*14,640,.9)+cloud(760-lt*10,520,.7);
  // building
  g+=`<polygon points="110,880 540,660 970,880" fill="#E5604D"/>`;
  g+=`<rect x="150" y="860" width="780" height="640" fill="#FFB37A"/>`;
  g+=`<rect x="370" y="770" width="340" height="78" rx="22" fill="${P.teal}"/><text x="540" y="822" font-size="40" font-weight="900" fill="#fff" text-anchor="middle">ШКОЛА ЖИЗНИ</text>`;
  const win=(x,y)=>`<rect x="${x}" y="${y}" width="150" height="150" rx="20" fill="#FFF2CF" stroke="#E58A4E" stroke-width="10"/><line x1="${x+75}" y1="${y}" x2="${x+75}" y2="${y+150}" stroke="#E58A4E" stroke-width="8"/><line x1="${x}" y1="${y+75}" x2="${x+150}" y2="${y+75}" stroke="#E58A4E" stroke-width="8"/>`;
  g+=win(210,930)+win(465,930)+win(720,930)+win(210,1160)+win(720,1160);
  g+=`<path d="M470,1500 L470,1250 A70,70 0 0 1 610,1250 L610,1500Z" fill="#A0613C"/><circle cx="590" cy="1390" r="8" fill="${P.yellow}"/>`;
  // ground & trees
  g+=`<rect x="0" y="1480" width="1080" height="440" fill="#8BD07A"/><polygon points="470,1490 610,1490 790,1920 290,1920" fill="#F6DDB4"/>`;
  const tree=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-16" y="-120" width="32" height="130" rx="10" fill="#8C5A3C"/><circle cx="0" cy="-190" r="95" fill="#4FA35F"/><circle cx="-55" cy="-140" r="60" fill="#5DBB6E"/><circle cx="55" cy="-140" r="60" fill="#5DBB6E"/></g>`;
  g+=tree(70,1500,1)+tree(1020,1500,1.1);
  // flowers
  for(let i=0;i<14;i++){const x=40+rnd(i)*1000,y=1560+rnd(i+30)*330;if(x>250&&x<830&&y<1900&&Math.abs(x-540)<(y-1490)*0.6+80)continue;g+=`<circle cx="${x}" cy="${y}" r="10" fill="${[P.yellow,P.pink,'#fff'][i%3]}"/>`;}
  // hero walking in
  const wt=clamp(lt/3.4); const x=lerp(-160,540,eio(wt));
  let o={x,y:1790,s:1.3};
  if(lt<3.4){const w=walk(lt);Object.assign(o,w);o.y-=w.bob;}
  else{o.aR=150+S((lt-3.4)*10)*18;o.mouth='laugh';}
  g+=`<ellipse cx="${x}" cy="1795" rx="90" ry="16" fill="#000" opacity=".1"/>`+hero(o);
  return g;
}

function atrium(lt){
  let g=bg('#FFEBCB','#FFE0B0');
  // big glass wall
  g+=`<rect x="110" y="540" width="860" height="820" rx="30" fill="#BFE6FF"/>`;
  for(let i=1;i<6;i++) g+=`<rect x="${110+i*143-6}" y="540" width="12" height="820" fill="#fff"/>`;
  g+=`<rect x="110" y="900" width="860" height="12" fill="#fff"/><rect x="110" y="540" width="860" height="820" rx="30" fill="none" stroke="#fff" stroke-width="18"/>`;
  g+=cloud(300+lt*12,700,.6)+cloud(800+lt*8,820,.45);
  // light beams
  g+=`<polygon points="250,540 450,540 640,1920 260,1920" fill="#FFF6C8" opacity=".25"/><polygon points="640,540 820,540 1000,1920 700,1920" fill="#FFF6C8" opacity=".2"/>`;
  g+=`<rect x="0" y="1360" width="1080" height="560" fill="#EBC497"/>`;
  for(let i=0;i<6;i++) g+=`<line x1="${i*216}" y1="1360" x2="${i*216-200+i*80}" y2="1920" stroke="#DDB283" stroke-width="5"/>`;
  g+=`<line x1="0" y1="1560" x2="1080" y2="1560" stroke="#DDB283" stroke-width="5"/>`;
  g+=plant(100,1420,1.1)+plant(985,1420,1.1);
  // back kids chatting
  const bkW=lt>2.4?140+S(lt*9)*20:10;
  g+=K('B',{x:270,y:1470,s:.82,mouth:S(lt*3)>0?'laugh':'smile'});
  g+=K('C',{x:820,y:1470,s:.82,aL:bkW});
  // hero & friend
  const hx=lerp(180,430,eo(lt/1));
  const fx=lerp(1200,690,eo(lt/1.3));
  const hi=lt>1.5&&lt<2.6;
  let ho={x:hx,y:1720,s:1.15,mouth:lt>1.5?'laugh':'smile'};
  if(lt<1){Object.assign(ho,walk(lt));} else ho.aR=hi?158:(lt>2.6?20:20);
  if(lt>3.5) ho.aR=40+S(lt*6)*10;
  let fo=Object.assign({},KIDS.A,{x:fx,y:1720,s:1.12,mouth:'laugh'});
  if(lt<1.3) Object.assign(fo,walk(lt)); else fo.aL=hi?158:20;
  g+=hero(ho)+kid(fo);
  if(lt>1.6&&lt<2.6){const k=pop(lt,1.6,.3)*(1-fade(lt,2.3,.3));g+=`<g opacity="${clamp(k)}">${star(560,1335,70*k,P.yellow,lt)}${star(560,1335,34*k,'#fff',-lt)}</g>`;}
  g+=bubble(800,1210,'Привет!',pop(lt,.9));
  g+=bubble(850,1020,'Доброе утро!',pop(lt,2.6),'#fff',36);
  g+=bubble(330,1200,'Как дела?',pop(lt,3.7));
  return g;
}

function lesson(lt){

  if(tk>0){g+=`<g transform="translate(540,880) scale(${tk})"><text x="0" y="-40" font-size="190" font-weight="900" text-anchor="middle" fill="#fff" stroke="${P.ink}" stroke-opacity=".12" stroke-width="10" paint-order="stroke">Школа</text><text x="0" y="150" font-size="190" font-weight="900" text-anchor="middle" fill="#fff" stroke="${P.ink}" stroke-opacity=".12" stroke-width="10" paint-order="stroke">Жизни</text>${heart(0,260,1.4,'#fff')}</g>`;}
  // line-up
  const L=[{x:110,s:.9,c:{hs:'tails',hair:'#2E1F1A',shirt:P.purple,skin:SK[1]}},{x:270,s:.98,c:KIDS.C},{x:410,s:1.05,c:KIDS.A},
    {x:670,s:1.05,c:KIDS.B},{x:810,s:.98,c:KIDS.D},{x:970,s:.9,c:{hs:'long',hair:'#2E1F1A',shirt:'#FF4F7B',skin:SK[1]}}];
  L.forEach((k,i)=>{const j=Math.max(0,S(lt*5+i*1.3))*22;g+=kid(Object.assign({},k.c,{x:k.x,y:1830-j,s:k.s,aL:150+S(lt*8+i)*15,aR:i%2?150:30,mouth:'laugh'}));});
  const hj=Math.max(0,S(lt*5+.7))*26;
  g+=hero({x:540,y:1870-hj,s:1.22,aL:155+S(lt*8)*12,aR:155-S(lt*8)*12,mouth:'laugh'});
  return g;
}

function renderCaps(t){
  let h='';
  CAPS.forEach(([t0,t1,cls,txt,col])=>{
    if(t<t0||t>t1)return;
    const k=back((t-t0)/.4), out=clamp((t1-t)/.25);
    const style=`transform:scale(${k*(.9+.1*out)});opacity:${out};${col?`background:${col};`:''}`;
    h+=`<div class="${cls}" style="${style}">${txt}</div>`;
  });
  document.getElementById('caps').innerHTML=h;
}

const XF=.45;
window.renderFrame=function(t){
  let out='';
  SCENES.forEach((sc,i)=>{
    const last=i===SCENES.length-1;
    if(t<sc.t0||t>=(last?Infinity:sc.t1+XF))return;
    const op=i===0?1:clamp((t-sc.t0)/XF);
    out+=`<g opacity="${op}">${sc.f(t-sc.t0)}</g>`;
  });
  document.getElementById('art').innerHTML=out;
  renderCaps(t);
};
window.TOTAL=TOTAL;
const q=new URLSearchParams(location.search);
renderFrame(parseFloat(q.get('t')||'2'));

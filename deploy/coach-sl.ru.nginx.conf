# /etc/nginx/sites-available/coach-sl.ru
# После установки: sudo certbot --nginx -d coach-sl.ru -d www.coach-sl.ru
server {
    listen 80;
    server_name coach-sl.ru www.coach-sl.ru;

    client_max_body_size 25m;   # загрузка файлов до 20 МБ

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;  # ИИ-анализ с документами может идти несколько минут
        proxy_send_timeout 600s;
    }
}

# Сайт + база данных + HTTPS. Настройки берутся из файла .env (см. deploy/README.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedlab
      POSTGRES_USER: pedlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedlab -d pedlab"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: pedlab-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pedlab:${POSTGRES_PASSWORD}@db:5432/pedlab
      APP_URL: ${APP_URL:?Задайте APP_URL в .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Задайте SEED_ADMIN_EMAIL в .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Задайте SEED_ADMIN_PASSWORD в .env}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - uploads:/app/storage/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Задайте SITE_ADDRESS в .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
